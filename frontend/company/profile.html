<form id="companyProfileForm">

    <input type="text"
           id="legalName"
           placeholder="Company Name">

    <input type="text"
           id="registrationNumber"
           placeholder="Registration Number">

    <input type="text"
           id="industry"
           placeholder="Industry">

    <input type="url"
           id="website"
           placeholder="Website">

    <textarea id="description"
              placeholder="Company Description">
    </textarea>

    <button type="submit">
        Save Profile
    </button>

</form>

<div id="verificationStatus"></div>

<input type="file" id="companyDocument">

<button id="uploadDocumentBtn">
    Upload Document
</button>

<button id="submitVerificationBtn">
    Submit Verification
</button>

<script src="../assets/js/pages.js"></script>
