<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Offers | NexHire</title><link rel="stylesheet" href="../assets/css/member5.css"></head><body>
<main class="member5-page"><header class="member5-header"><div><h1>Offers</h1><p class="member5-muted">Create, send, and withdraw offers for eligible applications.</p></div></header><div id="message" class="member5-message"></div>
<section class="member5-card"><h2>Create draft offer</h2><form id="offer-form" class="member5-form">
<label>Application ID<input name="applicationId" required></label><label>Amount<input type="number" min="0.01" step="0.01" name="amount" required></label><label>Currency<input maxlength="3" name="currency" value="LKR" required></label><label>Start date<input type="date" name="startDate" required></label><label>Expires at<input type="datetime-local" name="expiresAtUtc" required></label><label class="full">Terms<textarea name="terms" required></textarea></label><div class="full"><button class="member5-button" type="submit">Create draft</button></div>
</form></section><section style="margin-top:20px"><div id="offer-list" class="member5-loading">Loading offers…</div></section></main>
<script src="../assets/js/member5-common.js"></script><script src="../assets/js/company-offers.js"></script></body></html>
